name: MCP Permission Inspector Heavy Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/mcp_permission_inspector.py"
      - "tests/test_mcp_permission_inspector.py"
      - "tests/stress_mcp_permission_inspector.py"
      - "tests/fixtures/mcp-permission-inspector-*.json"
      - "resources/MCP-PERMISSION-INSPECTOR.md"
      - ".github/workflows/mcp-permission-inspector.yml"

permissions:
  contents: read

concurrency:
  group: mcp-permission-inspector-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Test on Python 3.10
        run: |
          python -W error::SyntaxWarning -m compileall -q tools tests
          python -m unittest tests.test_mcp_permission_inspector -v

      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Test on Python 3.11
        run: |
          python -W error::SyntaxWarning -m compileall -q tools tests
          python -m unittest tests.test_mcp_permission_inspector -v

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test on Python 3.12
        run: |
          python -W error::SyntaxWarning -m compileall -q tools tests
          python -m unittest tests.test_mcp_permission_inspector -v

      - name: Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test on Python 3.13
        run: |
          python -W error::SyntaxWarning -m compileall -q tools tests
          python -m unittest tests.test_mcp_permission_inspector -v

      - name: Safe/vulnerable fixture gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/mcp_permission_inspector.py tests/fixtures/mcp-permission-inspector-safe.json --fail-on high
          set +e
          python tools/mcp_permission_inspector.py tests/fixtures/mcp-permission-inspector-vulnerable.json --fail-on high
          code=$?
          set -e
          test "$code" -eq 3

  stress:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Deterministic fuzz and large-config stress
        run: python tests/stress_mcp_permission_inspector.py

      - name: Full repository regression suite
        run: python -m unittest discover -s tests -p "test_*.py"
