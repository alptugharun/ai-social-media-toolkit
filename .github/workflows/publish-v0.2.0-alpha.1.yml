name: Publish v0.2.0 Alpha Release

on:
  push:
    branches:
      - main
    paths:
      - "releases/v0.2.0-alpha.1.md"
      - ".github/workflows/publish-v0.2.0-alpha.1.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify release gate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools tests
          python tools/validate_prompt_library.py
          python -m unittest discover -s tests -v
          python tools/two_minute_demo.py > /tmp/two-minute-demo.md
          grep -q 'Two-Minute Proof' /tmp/two-minute-demo.md
          python tools/multi_provider_assistant.py --provider mock --prompt "release gate" | grep -q '\[mock\] release gate'

      - name: Publish prerelease if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.2.0-alpha.1
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "AI Social Media Toolkit v0.2.0-alpha.1" \
            --notes-file releases/v0.2.0-alpha.1.md \
            --prerelease
