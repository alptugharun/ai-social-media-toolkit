name: Verify Published v0.3 Alpha Release

# v0.3.0-alpha.1 is already public. This historical workflow must never rebuild
# newer main code into that old tag or overwrite its signed downloads.
# New source changes require a separately tested, versioned release.
on:
  push:
    branches: [main]
    paths:
      - "releases/v0.3.0-alpha.1.md"
      - "tools/build_release_assets.py"
      - ".github/workflows/publish-v0.3.0-alpha.1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read published release metadata without changing assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.3.0-alpha.1
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" > release-metadata.json
          python - <<'PYTHON'
          # BEGIN RELEASE METADATA CHECK
          import json
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          data = json.loads(Path("release-metadata.json").read_text(encoding="utf-8"))
          require(data.get("tag_name") == "v0.3.0-alpha.1", "Unexpected release tag")
          require(data.get("draft") is False, "Expected an already published release")
          expected = {
              "agent-skills-v0.3.0-alpha.1.zip",
              "creator-context-builder-v0.3.0-alpha.1.zip",
              "creator-frame-studio-v0.3.0-alpha.1.zip",
              "ai-social-media-toolkit-plugin-0.6.0.zip",
              "SHA256SUMS.txt",
          }
          assets = data.get("assets", [])
          require(isinstance(assets, list), "Invalid asset collection")
          require(all(isinstance(a, dict) for a in assets), "Invalid asset entry")
          names = [a.get("name") for a in assets]
          require(all(isinstance(n, str) for n in names), "Invalid asset name")
          require(len(names) == len(set(names)), "Duplicate asset names")
          by_name = {a["name"]: a for a in assets}
          require(expected.issubset(by_name), "Expected download assets are missing")
          for name in expected:
              asset = by_name[name]
              require(asset.get("state") == "uploaded", "Asset upload is incomplete")
              size = asset.get("size")
              require(type(size) is int and size > 0, "Asset is empty or has invalid size")
          print("PUBLISHED RELEASE METADATA PASS")
          print("No assets were downloaded, rebuilt, uploaded, deleted, or replaced.")
          print("Metadata checks do not verify checksums, signatures, or runtime behavior.")
          # END RELEASE METADATA CHECK
          PYTHON
