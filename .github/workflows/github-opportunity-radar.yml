name: GitHub Opportunity Radar

on:
  push:
    branches:
      - main
    paths:
      - "tools/github_growth_radar.py"
      - "tools/radar_issue_guard.py"
      - "tests/test_radar_issue_guard.py"
      - "skills/github-opportunity-radar/**"
      - "references/GITHUB-GROWTH-PLAYBOOK.md"
      - ".github/workflows/github-opportunity-radar.yml"
  schedule:
    # 05:20 UTC = 08:20 in Türkiye (UTC+3)
    - cron: "20 5 * * *"
  workflow_dispatch:

concurrency:
  group: github-opportunity-radar
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  radar:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Preflight self-test
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/github_growth_radar.py tools/radar_issue_guard.py
          python -m unittest discover -s tests -p 'test_github_growth_radar.py' -v
          python -m unittest discover -s tests -p 'test_radar_issue_guard.py' -v

      - name: Bootstrap pacing
        if: github.event_name == 'push'
        run: sleep 5

      - name: Generate evidence-aware opportunity report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/github_growth_radar.py --output /tmp/github-opportunity-radar.md

      - name: Create or refresh radar issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gh label create growth-radar \
            --description "Automated evidence-aware GitHub growth and skill-gap radar" \
            --color "1D76DB" \
            --force

          issue_number="7"

          gh issue view "$issue_number" \
            --json number,title,state,author,labels \
            > /tmp/github-opportunity-radar-issue.json

          python tools/radar_issue_guard.py \
            /tmp/github-opportunity-radar-issue.json \
            --issue-number "$issue_number"

          gh issue edit "$issue_number" \
            --body-file /tmp/github-opportunity-radar.md

      - name: Upload report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-opportunity-radar
          path: /tmp/github-opportunity-radar.md
          retention-days: 14
