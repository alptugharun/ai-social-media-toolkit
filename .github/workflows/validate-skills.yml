name: Validate Agent Skills

on:
  workflow_dispatch:
  push:
    paths:
      - "skills/**"
      - "tools/**"
      - "tests/**"
      - "examples/**"
      - "plugin.json"
      - "gemini-extension.json"
      - ".claude-plugin/**"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - "tools/**"
      - "tests/**"
      - "examples/**"
      - "plugin.json"
      - "gemini-extension.json"
      - ".claude-plugin/**"
      - ".github/workflows/validate-skills.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate SKILL.md files
        shell: bash
        run: |
          set -euo pipefail

          count=0

          while IFS= read -r -d '' file; do
            count=$((count + 1))
            echo "Checking $file"

            first_line="$(head -n 1 "$file")"
            if [ "$first_line" != "---" ]; then
              echo "::error file=$file::Missing YAML frontmatter start"
              exit 1
            fi

            frontmatter_delimiters="$(grep -c '^---$' "$file")"
            if [ "$frontmatter_delimiters" -lt 2 ]; then
              echo "::error file=$file::YAML frontmatter is not closed"
              exit 1
            fi

            if ! grep -q '^name:' "$file"; then
              echo "::error file=$file::Missing name field"
              exit 1
            fi

            if ! grep -q '^description:' "$file"; then
              echo "::error file=$file::Missing description field"
              exit 1
            fi

            if ! grep -q '^license:' "$file"; then
              echo "::error file=$file::Missing license field"
              exit 1
            fi

            dir_name="$(basename "$(dirname "$file")")"
            declared_name="$(sed -n 's/^name:[[:space:]]*//p' "$file" | head -n 1 | tr -d '"'"'"'')"
            if [ "$declared_name" != "$dir_name" ]; then
              echo "::error file=$file::Frontmatter name '$declared_name' must match directory '$dir_name'"
              exit 1
            fi

            if [[ ! "$declared_name" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || [ "${#declared_name}" -gt 64 ]; then
              echo "::error file=$file::Skill name must be kebab-case and at most 64 characters"
              exit 1
            fi

            description="$(sed -n 's/^description:[[:space:]]*//p' "$file" | head -n 1)"
            description="${description%\"}"
            description="${description#\"}"
            description="${description%\'}"
            description="${description#\'}"
            if [ -z "$description" ] || [ "${#description}" -gt 1024 ]; then
              echo "::error file=$file::Description must contain 1-1024 characters"
              exit 1
            fi

            line_count="$(wc -l < "$file")"
            if [ "$line_count" -gt 500 ]; then
              echo "::error file=$file::SKILL.md exceeds the 500-line portability limit"
              exit 1
            fi
          done < <(find skills -mindepth 2 -maxdepth 2 -name SKILL.md -print0)

          if [ "$count" -eq 0 ]; then
            echo "::error::No SKILL.md files found"
            exit 1
          fi

          echo "Validated $count skill files."

      - name: Validate JSON manifests and eval fixtures
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool plugin.json >/dev/null
          python -m json.tool gemini-extension.json >/dev/null
          python -m json.tool .claude-plugin/plugin.json >/dev/null

          while IFS= read -r -d '' file; do
            echo "Validating $file"
            python -m json.tool "$file" >/dev/null
          done < <(find skills -path '*/evals/*.json' -print0)

      - name: Compile Python tools and tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools tests

      - name: Run installer tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test installer
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          python tools/install_skills.py \
            --target agents \
            --scope project \
            --project-root "$tmpdir" \
            --skill creator-ops

          test -f "$tmpdir/.agents/skills/creator-ops/SKILL.md"

      - name: Smoke-test creator scoring tools
        shell: bash
        run: |
          set -euo pipefail

          outlier_output="$(python tools/outlier_score.py examples/social-outlier-posts.csv --top 1)"
          printf '%s\n' "$outlier_output"
          grep -q 'reel-004' <<< "$outlier_output"

          signal_output="$(python tools/signal2content_score.py examples/signal2content-opportunities.csv --top 1)"
          printf '%s\n' "$signal_output"
          grep -q 'Pinterest seasonal visual series' <<< "$signal_output"
