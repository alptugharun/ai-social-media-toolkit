name: Validate Agent Skills

on:
  push:
    paths:
      - "skills/**"
      - "tools/**"
      - "tests/**"
      - "plugin.json"
      - "gemini-extension.json"
      - ".claude-plugin/**"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - "tools/**"
      - "tests/**"
      - "plugin.json"
      - "gemini-extension.json"
      - ".claude-plugin/**"
      - ".github/workflows/validate-skills.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate SKILL.md files
        shell: bash
        run: |
          set -euo pipefail

          count=0

          while IFS= read -r -d '' file; do
            count=$((count + 1))
            echo "Checking $file"

            first_line="$(head -n 1 "$file")"
            if [ "$first_line" != "---" ]; then
              echo "::error file=$file::Missing YAML frontmatter start"
              exit 1
            fi

            if ! grep -q '^name:' "$file"; then
              echo "::error file=$file::Missing name field"
              exit 1
            fi

            if ! grep -q '^description:' "$file"; then
              echo "::error file=$file::Missing description field"
              exit 1
            fi

            if ! grep -q '^license:' "$file"; then
              echo "::error file=$file::Missing license field"
              exit 1
            fi

            dir_name="$(basename "$(dirname "$file")")"
            declared_name="$(sed -n 's/^name:[[:space:]]*//p' "$file" | head -n 1 | tr -d '"'"'"'')"
            if [ "$declared_name" != "$dir_name" ]; then
              echo "::error file=$file::Frontmatter name '$declared_name' must match directory '$dir_name'"
              exit 1
            fi
          done < <(find skills -mindepth 2 -maxdepth 2 -name SKILL.md -print0)

          if [ "$count" -eq 0 ]; then
            echo "::error::No SKILL.md files found"
            exit 1
          fi

          echo "Validated $count skill files."

      - name: Validate JSON manifests
        shell: bash
        run: |
          python -m json.tool plugin.json >/dev/null
          python -m json.tool gemini-extension.json >/dev/null
          python -m json.tool .claude-plugin/plugin.json >/dev/null

      - name: Run installer tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test installer
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          python tools/install_skills.py             --target agents             --scope project             --project-root "$tmpdir"             --skill creator-ops

          test -f "$tmpdir/.agents/skills/creator-ops/SKILL.md"
