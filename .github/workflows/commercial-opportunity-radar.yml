name: Commercial Opportunity Radar

on:
  schedule:
    # 05:50 UTC = 08:50 in Türkiye (UTC+3)
    - cron: "50 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  radar:
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate commercial opportunity report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/commercial_opportunity_radar.py --output /tmp/commercial-opportunity-radar.md

      - name: Create or refresh commercial radar issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gh label create commercial-radar \
            --description "Automated evidence-aware commercial opportunity radar" \
            --color "FBCA04" \
            --force

          issue_number="$(
            gh issue list \
              --label commercial-radar \
              --state open \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" \
              --title "Commercial Opportunity Radar — latest" \
              --body-file /tmp/commercial-opportunity-radar.md
          else
            gh issue create \
              --title "Commercial Opportunity Radar — latest" \
              --body-file /tmp/commercial-opportunity-radar.md \
              --label commercial-radar
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: commercial-opportunity-radar
          path: /tmp/commercial-opportunity-radar.md
          retention-days: 14
