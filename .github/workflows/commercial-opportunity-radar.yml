name: Commercial Opportunity Radar

on:
  push:
    branches:
      - main
    paths:
      - "tools/commercial_opportunity_radar.py"
      - "skills/commercial-opportunity-radar/**"
      - "skills/monetization-architect/**"
      - "references/OPEN-SOURCE-MONETIZATION-PLAYBOOK.md"
      - ".github/workflows/commercial-opportunity-radar.yml"
  schedule:
    # 05:50 UTC = 08:50 in Türkiye (UTC+3)
    - cron: "50 5 * * *"
  workflow_dispatch:

concurrency:
  group: commercial-opportunity-radar
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight self-test
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/commercial_opportunity_radar.py
          python -m unittest discover -s tests -p 'test_commercial_opportunity_radar.py' -v

      - name: Bootstrap pacing
        if: github.event_name == 'push'
        run: sleep 160

      - name: Generate commercial opportunity report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/commercial_opportunity_radar.py --output /tmp/commercial-opportunity-radar.md

      - name: Create or refresh commercial radar issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gh label create commercial-radar \
            --description "Automated evidence-aware commercial opportunity radar" \
            --color "FBCA04" \
            --force

          issue_number="$(
            gh issue list \
              --label commercial-radar \
              --state open \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" \
              --title "Commercial Opportunity Radar — latest" \
              --body-file /tmp/commercial-opportunity-radar.md
          else
            gh issue create \
              --title "Commercial Opportunity Radar — latest" \
              --body-file /tmp/commercial-opportunity-radar.md \
              --label commercial-radar
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: commercial-opportunity-radar
          path: /tmp/commercial-opportunity-radar.md
          retention-days: 14
