name: Creator Frame Studio checks

on:
  pull_request:
    paths:
      - 'tools/creator-frame-studio/**'
      - '.github/workflows/creator-frame-studio.yml'
  push:
    branches: [main]
    paths:
      - 'tools/creator-frame-studio/**'
      - '.github/workflows/creator-frame-studio.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: node --check tools/creator-frame-studio/app.js
      - name: Run static smoke checks
        run: node tools/creator-frame-studio/tests/smoke.mjs
