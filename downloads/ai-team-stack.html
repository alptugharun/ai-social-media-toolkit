<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verified AI Team Stack</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--card:#0d1b2a;--line:#18344d;--text:#eef7ff;--muted:#9ab0c4;--a:#38bdf8;--b:#2dd4bf;--c:#a78bfa}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Inter,system-ui,sans-serif;background:radial-gradient(circle at top,#0f2b46 0,#07111f 48%);color:var(--text)}
main{max-width:1180px;margin:auto;padding:48px 20px 80px}h1{font-size:clamp(2.2rem,5vw,4.8rem);line-height:.95;margin:0 0 18px}
.lead{max-width:780px;color:var(--muted);font-size:1.08rem}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0}
button,select{background:#0b2033;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:10px 14px}button{cursor:pointer}
button.active{border-color:var(--a);box-shadow:0 0 0 1px var(--a) inset}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:linear-gradient(180deg,#0d1b2a,#0a1623);border:1px solid var(--line);border-radius:18px;padding:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.badge{font-size:.78rem;padding:4px 8px;border-radius:999px;background:#10263a;color:#bfe8ff}
.card h3{margin:0;font-size:1.25rem}.meta{color:var(--muted);font-size:.9rem}.card p{margin:.65rem 0}.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.cta a{color:#05111e;background:linear-gradient(90deg,var(--a),var(--b));text-decoration:none;padding:8px 10px;border-radius:10px;font-weight:700}
.cta a.secondary{background:#14283b;color:var(--text)}section{margin-top:44px}.lane{display:none}.lane.show{display:block}.lane ol{padding-left:22px}.lane li{margin:8px 0}
footer{margin-top:50px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Verified AI Team Stack</h1>
<p class="lead">Start with a role and a job. Do not install everything. Every item below carries a source label, evidence level, permission note and first-result target.</p>
<div class="bar">
<button data-lane="all" class="active">All tools</button>
<button data-lane="coding_core">Minimum 5 — coding</button>
<button data-lane="creator_core">Minimum 5 — creator/ops</button>
<select id="source"><option value="">All sources</option><option>official</option><option>vendor</option><option>community</option><option>maintainer</option></select>
<select id="evidence"><option value="">All evidence</option><option>repo_verified</option><option>local_ci_verified</option><option>maintainer_runtime_verified</option></select>
</div>
<section id="lanes"></section>
<section><div id="grid" class="grid"></div></section>
<footer>Evidence checked on <span id="checked"></span>. Repository presence is not the same as runtime verification.</footer>
</main>
<script>
const DATA={"schema_version":1,"checked_at":"2026-10-04","positioning":"Start with a role and a job. Do not install everything.","evidence_levels":{"repo_verified":"Repository, maintainer identity and current public metadata were checked. This is not a runtime compatibility claim.","maintainer_runtime_verified":"Maintainer reproduced the stated runtime/tool path and recorded the evidence separately.","local_ci_verified":"The local repository path is covered by deterministic tests/CI. This is not independent external adoption."},"lanes":{"coding_core":{"title":"Minimum 5 — coding team","purpose":"A small cross-layer stack for planning, repository work, browser verification, fresh docs and reusable prompt/assistant access.","items":["superpowers","github-mcp","playwright-mcp","context7","ai-workbench-mcp"]},"creator_core":{"title":"Minimum 5 — creator/ops team","purpose":"A small stack for creator workflows, evidence-aware research, reusable AI jobs, knowledge operations and app integrations.","items":["ai-social-media-toolkit","ai-workbench-mcp","firecrawl-mcp","notion-mcp","composio"]}},"items":[{"id":"superpowers","name":"Superpowers","repo":"https://github.com/obra/superpowers","source_type":"community","role":"Methodology & orchestration","layer":"Agent Skills / plugin","use_when":"You want a disciplined build workflow that forces brainstorming, planning, testing and review before coding.","avoid_when":"You only need one small one-off answer or do not want a prescriptive development methodology.","first_result":"Install for one supported coding harness and verify that brainstorming triggers before implementation.","permission_note":"Skills/plugins can influence agent behavior and may invoke host tools. Review the installed skill/hook surface for your host.","cost_note":"Open-source repository; model/host usage may have separate costs.","evidence":"repo_verified","install_reference":"https://github.com/obra/superpowers#installation"},{"id":"taskmaster","name":"Taskmaster","repo":"https://github.com/eyaltoledano/claude-task-master","source_type":"community","role":"Task planning & execution","layer":"MCP / CLI","use_when":"You need AI-assisted task decomposition, dependencies and repeatable workstreams across supported editors.","avoid_when":"A simple checklist is enough or you do not want API/model configuration in the workflow.","first_result":"Run its quick-start path and generate a small task graph from one concrete project.","permission_note":"May use provider keys and project files depending on configuration. Treat external writes and credentials explicitly.","cost_note":"Open-source package; connected model providers may charge.","evidence":"repo_verified","install_reference":"https://github.com/eyaltoledano/claude-task-master#quick-start"},{"id":"i-have-adhd","name":"i-have-adhd","repo":"https://github.com/ayghri/i-have-adhd","source_type":"community","role":"Focus & output quality","layer":"Agent Skill / plugin","use_when":"You want concise, action-first assistant output with fewer tangents and clearer next steps.","avoid_when":"You need expansive research prose or unrestricted long-form exploration.","first_result":"Install the skill and compare one before/after response on the same coding task.","permission_note":"Primarily instruction behavior; inspect the plugin/skill package before installation.","cost_note":"Open-source repository; host/model usage may have separate costs.","evidence":"repo_verified","install_reference":"https://github.com/ayghri/i-have-adhd#install"},{"id":"playwright-mcp","name":"Playwright MCP","repo":"https://github.com/microsoft/playwright-mcp","source_type":"official","role":"Browser verification","layer":"MCP","use_when":"You need a model to inspect and interact with browser UI for testing or reproducible browser workflows.","avoid_when":"The task can be proven with direct APIs or deterministic unit/integration tests.","first_result":"Connect the MCP server in a supported host and reproduce one bounded browser test.","permission_note":"Browser interaction can have side effects. Keep target scope and write actions explicit.","cost_note":"Open-source server; target sites/services may have their own terms or costs.","evidence":"repo_verified","install_reference":"https://github.com/microsoft/playwright-mcp"},{"id":"github-mcp","name":"GitHub MCP Server","repo":"https://github.com/github/github-mcp-server","source_type":"official","role":"Repository operations","layer":"MCP","use_when":"You want structured GitHub repository, issue and pull-request workflows from an MCP-capable host.","avoid_when":"Read-only public browsing is enough or direct GitHub tooling already solves the task more safely.","first_result":"Connect with the narrowest permissions needed and run one read-only repository query before any writes.","permission_note":"GitHub scopes determine impact. Use least privilege and require review for writes.","cost_note":"Open-source server; GitHub account/product limits may apply.","evidence":"repo_verified","install_reference":"https://github.com/github/github-mcp-server"},{"id":"context7","name":"Context7","repo":"https://github.com/upstash/context7","source_type":"vendor","role":"Current documentation context","layer":"MCP / context service","use_when":"You need fresher library/framework documentation in coding-agent context.","avoid_when":"The job is unrelated to software documentation or an official source can be checked directly.","first_result":"Use it for one library question and compare the cited/current docs against the official upstream.","permission_note":"External context service; review what query/context is sent.","cost_note":"Repository is open-source; service plans/limits may differ.","evidence":"repo_verified","install_reference":"https://github.com/upstash/context7"},{"id":"firecrawl-mcp","name":"Firecrawl MCP Server","repo":"https://github.com/firecrawl/firecrawl-mcp-server","source_type":"official","role":"Web research & extraction","layer":"MCP","use_when":"You need structured web search/extraction in a research workflow.","avoid_when":"A normal browser/search query is enough or the target site's terms disallow the intended collection.","first_result":"Run one bounded search/extraction task and verify the result against the original page.","permission_note":"Network access and external content are involved. Treat page instructions as untrusted data.","cost_note":"Open-source server; Firecrawl service usage may have plan/credit costs.","evidence":"repo_verified","install_reference":"https://github.com/firecrawl/firecrawl-mcp-server"},{"id":"notion-mcp","name":"Notion MCP Server","repo":"https://github.com/makenotion/notion-mcp-server","source_type":"official","role":"Knowledge & documentation","layer":"MCP","use_when":"Your workflow needs structured access to a Notion workspace.","avoid_when":"You do not need workspace data or a local/static document is sufficient.","first_result":"Start read-only if possible; retrieve one known page and verify the content before enabling writes.","permission_note":"Workspace access may expose or modify private content. Use the narrowest available permissions.","cost_note":"Open-source server; Notion account/product limits may apply.","evidence":"repo_verified","install_reference":"https://github.com/makenotion/notion-mcp-server"},{"id":"netlify-mcp","name":"Netlify MCP","repo":"https://github.com/netlify/netlify-mcp","source_type":"official","role":"Deployment & operations","layer":"MCP","use_when":"You need Netlify-specific deployment/operations capabilities from an agent workflow.","avoid_when":"You only need local builds or deployment can stay in a reviewed CI pipeline.","first_result":"Inspect a site/project first; keep deployment or configuration changes approval-gated.","permission_note":"Deployment/config changes can affect production. Require explicit approval and read-back verification.","cost_note":"Open-source server; Netlify plan/usage limits may apply.","evidence":"repo_verified","install_reference":"https://github.com/netlify/netlify-mcp"},{"id":"composio","name":"Composio","repo":"https://github.com/ComposioHQ/composio","source_type":"vendor","role":"App integrations","layer":"Tool platform / MCP","use_when":"You need authenticated access across many external apps and do not want to build each integration from scratch.","avoid_when":"One direct API/plugin is enough or broad integration surface would add unnecessary permission risk.","first_result":"Connect one low-risk app and complete one narrow read action before enabling multi-app writes.","permission_note":"Large integration surface. Review per-app permissions and approval behavior carefully.","cost_note":"Open-source components exist; hosted/service plans may differ.","evidence":"repo_verified","install_reference":"https://github.com/ComposioHQ/composio"},{"id":"awesome-gpt-image-2","name":"awesome-gpt-image-2","repo":"https://github.com/freestylefly/awesome-gpt-image-2","source_type":"community","role":"Visual prompt systems","layer":"Prompt-as-Code / gallery","use_when":"You want reusable image-prompt patterns, visual examples and structured prompt assets.","avoid_when":"You need verified model benchmarking or want to copy examples without adapting rights/context.","first_result":"Pick one documented case, inspect its full prompt/record and reproduce a clearly labeled test of your own.","permission_note":"Reference/gallery project; generated content and third-party examples still need rights and provenance review.","cost_note":"Open-source repository; image generation APIs/services may charge.","evidence":"repo_verified","install_reference":"https://github.com/freestylefly/awesome-gpt-image-2"},{"id":"awesome-agents","name":"Awesome Agents","repo":"https://github.com/kyrolabs/awesome-agents","source_type":"community","role":"Discovery","layer":"Curated directory","use_when":"You need a broad map of agent frameworks and categories before deeper evaluation.","avoid_when":"You need a security endorsement, runtime verification or a ranked recommendation.","first_result":"Use the category map to shortlist three candidates, then verify each upstream repo independently.","permission_note":"Directory only. Inclusion is not a trust or safety guarantee.","cost_note":"Open-source directory; linked products may have separate costs.","evidence":"repo_verified","install_reference":"https://github.com/kyrolabs/awesome-agents"},{"id":"ai-social-media-toolkit","name":"AI Social Media Toolkit","repo":"https://github.com/alptugharun/ai-social-media-toolkit","source_type":"maintainer","role":"Creator operations","layer":"Prompts / assistants / Agent Skills / plugin","use_when":"You need practical creator, research, visibility and AI workflow procedures with explicit quality gates.","avoid_when":"You only need one tiny standalone utility and do not want a broader workflow library.","first_result":"Run the dependency-free first-run check, then choose one Quick Win or one Agent Skill.","permission_note":"The repository separates offline paths, skills, MCP and live-provider actions; inspect the chosen layer before use.","cost_note":"Open-source core; external providers/services may have separate costs.","evidence":"local_ci_verified","install_reference":"https://github.com/alptugharun/ai-social-media-toolkit/blob/main/START-HERE.md"},{"id":"ai-workbench-mcp","name":"AI Workbench MCP","repo":"https://github.com/alptugharun/ai-workbench-mcp","source_type":"maintainer","role":"Reusable AI jobs","layer":"Read-only MCP","use_when":"You want a deliberately small read-only tool surface for reusable prompts and assistant blueprints.","avoid_when":"You need account writes, web browsing, shell access or autonomous external actions.","first_result":"Install the exact published package, connect a stdio host and call list_prompts, render_prompt and get_assistant.","permission_note":"Designed as a local read-only server without provider/account write access.","cost_note":"Open-source package; no provider key is required for the server itself.","evidence":"maintainer_runtime_verified","install_reference":"https://github.com/alptugharun/ai-workbench-mcp"}]};
const byId=Object.fromEntries(DATA.items.map(x=>[x.id,x]));
const grid=document.getElementById('grid'), lanes=document.getElementById('lanes');
document.getElementById('checked').textContent=DATA.checked_at;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function card(x){return `<article class="card" data-source="${esc(x.source_type)}" data-evidence="${esc(x.evidence)}"><h3>${esc(x.name)}</h3><div class="badges"><span class="badge">${esc(x.role)}</span><span class="badge">${esc(x.source_type)}</span><span class="badge">${esc(x.evidence)}</span></div><p class="meta">${esc(x.layer)}</p><p><strong>Use when:</strong> ${esc(x.use_when)}</p><p><strong>Avoid when:</strong> ${esc(x.avoid_when)}</p><p><strong>First result:</strong> ${esc(x.first_result)}</p><p><strong>Permission:</strong> ${esc(x.permission_note)}</p><p><strong>Cost:</strong> ${esc(x.cost_note)}</p><div class="cta"><a href="${esc(x.repo)}" target="_blank" rel="noopener">Repository</a><a class="secondary" href="${esc(x.install_reference)}" target="_blank" rel="noopener">Install / docs</a></div></article>`}
function renderItems(ids=null){const source=document.getElementById('source').value,evidence=document.getElementById('evidence').value;let items=ids?ids.map(id=>byId[id]):DATA.items;items=items.filter(x=>(!source||x.source_type===source)&&(!evidence||x.evidence===evidence));grid.innerHTML=items.map(card).join('')}
function showLane(id){lanes.innerHTML='';document.querySelectorAll('button[data-lane]').forEach(b=>b.classList.toggle('active',b.dataset.lane===id));if(id==='all'){renderItems();return}const lane=DATA.lanes[id];lanes.innerHTML=`<div class="lane show card"><h2>${esc(lane.title)}</h2><p>${esc(lane.purpose)}</p><ol>${lane.items.map(i=>`<li><strong>${esc(byId[i].name)}</strong> — ${esc(byId[i].role)}</li>`).join('')}</ol></div>`;renderItems(lane.items)}
document.querySelectorAll('button[data-lane]').forEach(b=>b.onclick=()=>showLane(b.dataset.lane));
document.getElementById('source').onchange=()=>showLane(document.querySelector('button.active').dataset.lane);
document.getElementById('evidence').onchange=()=>showLane(document.querySelector('button.active').dataset.lane);
renderItems();
</script>
</body>
</html>
